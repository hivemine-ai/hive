name: Release hivectl

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish (without leading "v"). Example: 0.1.0'
        required: true
        type: string
      dry_run:
        description: 'Run all build steps but skip npm publish (smoke test).'
        required: false
        default: false
        type: boolean
  # Tag-driven release is opt-in for v0.2+; keep dispatch-only for v0.1.x to
  # minimise risk of accidental publishes from a mis-pushed tag.
  # push:
  #   tags:
  #     - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.13.1'

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.value }}
    steps:
      - name: Resolve version
        id: set-version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::version input is required"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-zA-Z.-]+)?$ ]]; then
            echo "::error::version must match semver (got: $VERSION)"
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

  build:
    name: Build SEA (${{ matrix.platform }}-${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            sea_target: linux
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            sea_target: linux
          # darwin-x64 (Intel Mac) intentionally absent in v0.1.0 — Github
          # Free org plan does not include `macos-*-large` (the only x64 Mac
          # runners), and the only free x64 Mac runner (`macos-13`) is
          # subject to severe pool scarcity and a sunset deprecation.
          # Intel Mac users use the Linux x64 binary via Rosetta 2; see
          # CHANGELOG.md and README.md for details. Reversible (1-line
          # re-add) when the constraint is lifted. (PRY-054)
          - os: macos-14
            platform: darwin
            arch: arm64
            sea_target: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm --filter @hive/cli build

      - name: Build SEA binary
        run: pnpm --filter @hive/cli sea:build:${{ matrix.sea_target }}

      - name: Verify binary runs
        shell: bash
        run: |
          chmod +x packages/cli/dist-sea/hivectl
          # Symlink better-sqlite3 next to the binary so the SEA's require can
          # resolve it. In production, npm installs better-sqlite3 alongside
          # the platform package (declared as dependency).
          mkdir -p packages/cli/dist-sea/node_modules
          ln -s "$(pnpm --filter @hive/server exec node -p "require.resolve('better-sqlite3/package.json')" | xargs dirname)" packages/cli/dist-sea/node_modules/better-sqlite3
          packages/cli/dist-sea/hivectl --version

      - name: Upload SEA binary
        uses: actions/upload-artifact@v4
        with:
          name: hivectl-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/cli/dist-sea/hivectl
          if-no-files-found: error
          retention-days: 7

  publish-binaries:
    name: Publish binary packages
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - platform: linux
            arch: x64
            os_filter: linux
            cpu_filter: x64
          - platform: linux
            arch: arm64
            os_filter: linux
            cpu_filter: arm64
          # darwin-x64 (Intel Mac) intentionally absent in v0.1.0 — see the
          # build matrix above + CHANGELOG.md for the rationale. (PRY-054)
          - platform: darwin
            arch: arm64
            os_filter: darwin
            cpu_filter: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Download SEA binary
        uses: actions/download-artifact@v4
        with:
          name: hivectl-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifact/

      - name: Stage platform package
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM_NAME="${{ matrix.platform }}-${{ matrix.arch }}"
          PKG_DIR="staging/@hivemine/hivectl-${PLATFORM_NAME}"
          mkdir -p "${PKG_DIR}/bin"
          cp artifact/hivectl "${PKG_DIR}/bin/hivectl"
          chmod +x "${PKG_DIR}/bin/hivectl"
          sed \
            -e "s|{{PLATFORM_NAME}}|${PLATFORM_NAME}|g" \
            -e "s|{{VERSION}}|${VERSION}|g" \
            -e "s|{{OS}}|${{ matrix.os_filter }}|g" \
            -e "s|{{CPU}}|${{ matrix.cpu_filter }}|g" \
            npm/platforms/package.json.template \
            > "${PKG_DIR}/package.json"
          echo "::group::Staged package"
          cat "${PKG_DIR}/package.json"
          ls -la "${PKG_DIR}/bin"
          echo "::endgroup::"

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PLATFORM_NAME="${{ matrix.platform }}-${{ matrix.arch }}"
          cd "staging/@hivemine/hivectl-${PLATFORM_NAME}"
          npm publish --access public

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          PLATFORM_NAME="${{ matrix.platform }}-${{ matrix.arch }}"
          echo "[dry-run] would publish @hivemine/hivectl-${PLATFORM_NAME}@${{ needs.prepare.outputs.version }}"

  publish-wrapper:
    name: Publish wrapper package
    needs: [prepare, publish-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Pin wrapper version + optionalDependencies
        run: |
          cd npm/hivectl
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.prepare.outputs.version }}';
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '${{ needs.prepare.outputs.version }}';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          cat package.json

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm/hivectl
          npm publish --access public

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "[dry-run] would publish @hivemine/hivectl@${{ needs.prepare.outputs.version }}"

  github-release:
    name: GitHub release
    needs: [prepare, publish-wrapper]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Rename binaries for release assets
        shell: bash
        run: |
          mkdir -p release-assets
          for dir in artifacts/hivectl-*; do
            platform_arch="${dir#artifacts/hivectl-}"
            cp "${dir}/hivectl" "release-assets/hivectl-${platform_arch}"
            chmod +x "release-assets/hivectl-${platform_arch}"
          done
          ls -la release-assets

      - name: Create GitHub release
        # Pinned to commit SHA (release 2.6.2) per security review; mutable v2
        # tag would let a compromised action exfiltrate the workflow's
        # GITHUB_TOKEN (contents: write).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
