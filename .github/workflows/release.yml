name: Release hivectl

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish (without leading "v"). Example: 0.1.0'
        required: true
        type: string
      dry_run:
        description: 'Run all build steps but skip npm publish (smoke test).'
        required: false
        default: false
        type: boolean
  # Release published via the GitHub Releases UI (Releases → New release → Publish).
  # Workflow extracts version from the tag name and runs the publish pipeline,
  # then attaches the binaries to the existing release. The `release` event only
  # fires when a release is explicitly published from UI or API draft-publish —
  # NOT on `git push --tags`, which preserves the original PRY-033 guarantee
  # against accidental publishes from mis-pushed tags. The `push: tags` event
  # remains intentionally disabled. (PRY-058 supersedes the dispatch-only
  # decision of PRY-033; see the ADR-019 changelog entry.)
  release:
    types: [published]

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.13.1'

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.value }}
      dry_run: ${{ steps.set-version.outputs.dry_run }}
      bsqlite3_version: ${{ steps.set-bsqlite3.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and dry_run
        id: set-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            # Release published via the GitHub Releases UI. Extract version
            # from the tag name (strip leading "v"). dry_run is always false
            # for UI-triggered releases — dry-run path remains workflow_dispatch.
            VERSION="${RELEASE_TAG#v}"
            DRY_RUN="false"
          else
            VERSION="$DISPATCH_VERSION"
            DRY_RUN="$DISPATCH_DRY_RUN"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::version is required (workflow_dispatch input or release tag)"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9a-zA-Z.-]+)?$ ]]; then
            echo "::error::version must match semver (got: $VERSION)"
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (event: ${EVENT_NAME}, dry_run: ${DRY_RUN})"

      - name: Resolve better-sqlite3 version from pnpm lockfile
        id: set-bsqlite3
        run: |
          # Extract the exact better-sqlite3 version pnpm resolved into the
          # lockfile, propagated as an output to publish-binaries so the bundle
          # step installs the same version that CI/dev tested against. Closes
          # the supply-chain gap of the previous `^11.7.0` semver range, which
          # would silently pick up a future 11.x.y patch released between
          # merge and a real release trigger. Single source of truth: pnpm
          # lockfile (committed in the repo).
          VERSION=$(grep -E "^  better-sqlite3@[0-9]" pnpm-lock.yaml | head -1 | sed -E 's/^  better-sqlite3@([0-9.]+):.*/\1/')
          if [[ -z "$VERSION" ]]; then
            echo "::error::Failed to extract better-sqlite3 version from pnpm-lock.yaml"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Extracted better-sqlite3 version is not valid semver (got: $VERSION)"
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved better-sqlite3 version from pnpm-lock.yaml: ${VERSION}"

  build:
    name: Build SEA (${{ matrix.platform }}-${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            sea_target: linux
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            sea_target: linux
          # darwin-x64 (Intel Mac) intentionally absent in v0.1.0 — GitHub
          # Free org plan does not include `macos-*-large` (the only x64 Mac
          # runners), and the only free x64 Mac runner (`macos-13`) is
          # subject to severe pool scarcity and a sunset deprecation.
          # Intel Mac users use the Linux x64 binary via Rosetta 2; see
          # CHANGELOG.md and README.md for details. Reversible (1-line
          # re-add) when the constraint is lifted. (PRY-054)
          - os: macos-14
            platform: darwin
            arch: arm64
            sea_target: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync release version to source
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Rewrite the HIVE_VERSION sentinel in @hive/shared/version.ts before
          # `pnpm build` so the SEA bundle bakes in the actual release tag.
          # Fails explicitly if the pattern is not matched, preventing a silent
          # ship of '0.1.0-dev' to npm. (PRY-060 Bug B fix.)
          #
          # Cross-runner portable rewrite via temp file (GNU sed `-i` and BSD
          # sed `-i ''` differ; `>tmp && mv` works on every runner).
          PATH_FILE="packages/shared/src/version.ts"
          # Pre-flight: assert the dev sentinel pattern exists on the
          # HIVE_VERSION export line. This decouples "pattern not in file"
          # from the "sed no-op replacement" edge case that would fire if
          # the workflow were dispatched with a `-dev` pre-release version
          # (e.g. `0.1.0-dev`) — both the BEFORE and AFTER captures would
          # be identical without indicating whether the sentinel was matched.
          if ! grep -E "^export const HIVE_VERSION = '[^']*-dev';" "$PATH_FILE" > /dev/null; then
            echo "FAIL: HIVE_VERSION dev sentinel pattern not present in $PATH_FILE"
            cat "$PATH_FILE"
            exit 1
          fi
          BEFORE=$(grep "^export const HIVE_VERSION" "$PATH_FILE")
          sed "s/'[^']*-dev'/'${RELEASE_VERSION}'/" "$PATH_FILE" > "$PATH_FILE.tmp"
          mv "$PATH_FILE.tmp" "$PATH_FILE"
          AFTER=$(grep "^export const HIVE_VERSION" "$PATH_FILE")
          echo "Synced HIVE_VERSION:"
          echo "  before: $BEFORE"
          echo "  after:  $AFTER"

      - name: Build TypeScript
        run: pnpm --filter @hive/cli build

      - name: Build SEA binary
        run: pnpm --filter @hive/cli sea:build:${{ matrix.sea_target }}

      - name: Verify binary runs
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x packages/cli/dist-sea/hivectl
          # Symlink better-sqlite3 next to the binary so the SEA's require can
          # resolve it during the smoke `--version` invocation. In production,
          # the matching better-sqlite3 prebuild is bundled into the platform
          # package via `bundleDependencies` (PRY-060 Bug A fix); this symlink
          # is build-time only.
          mkdir -p packages/cli/dist-sea/node_modules
          ln -s "$(pnpm --filter @hive/server exec node -p "require.resolve('better-sqlite3/package.json')" | xargs dirname)" packages/cli/dist-sea/node_modules/better-sqlite3
          # Assert the binary reports the release version, not the dev sentinel.
          # Fails explicitly if the version sync step did not propagate. (PRY-060)
          BINARY_VERSION=$(packages/cli/dist-sea/hivectl --version | tail -1 | tr -d '[:space:]')
          if [ "$BINARY_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "FAIL: hivectl --version returned '$BINARY_VERSION', expected '$EXPECTED_VERSION'"
            exit 1
          fi
          echo "OK: hivectl --version matches expected: $BINARY_VERSION"

      - name: Upload SEA binary
        uses: actions/upload-artifact@v4
        with:
          name: hivectl-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/cli/dist-sea/hivectl
          if-no-files-found: error
          retention-days: 7

  publish-binaries:
    name: Publish binary packages
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix:
        include:
          - platform: linux
            arch: x64
            os_filter: linux
            cpu_filter: x64
          - platform: linux
            arch: arm64
            os_filter: linux
            cpu_filter: arm64
          # darwin-x64 (Intel Mac) intentionally absent in v0.1.0 — see the
          # build matrix above + CHANGELOG.md for the rationale. (PRY-054)
          - platform: darwin
            arch: arm64
            os_filter: darwin
            cpu_filter: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Download SEA binary
        uses: actions/download-artifact@v4
        with:
          name: hivectl-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifact/

      - name: Stage platform package
        shell: bash
        env:
          BSQLITE3_VERSION: ${{ needs.prepare.outputs.bsqlite3_version }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM_NAME="${{ matrix.platform }}-${{ matrix.arch }}"
          PKG_DIR="staging/@hivemine/hivectl-${PLATFORM_NAME}"
          mkdir -p "${PKG_DIR}/bin"
          cp artifact/hivectl "${PKG_DIR}/bin/hivectl"
          chmod +x "${PKG_DIR}/bin/hivectl"
          # Interpolate BSQLITE3_VERSION into the template's `dependencies`
          # field. npm requires bundleDependencies entries to ALSO be in
          # `dependencies` (or devDependencies) for the bundling to take
          # effect; without this, npm silently produces a tarball without
          # the bundled subdir. Single source of truth: pnpm-lock.yaml via
          # the `bsqlite3_version` job output.
          sed \
            -e "s|{{PLATFORM_NAME}}|${PLATFORM_NAME}|g" \
            -e "s|{{VERSION}}|${VERSION}|g" \
            -e "s|{{OS}}|${{ matrix.os_filter }}|g" \
            -e "s|{{CPU}}|${{ matrix.cpu_filter }}|g" \
            -e "s|{{BSQLITE3_VERSION}}|${BSQLITE3_VERSION}|g" \
            npm/platforms/package.json.template \
            > "${PKG_DIR}/package.json"
          echo "::group::Staged package.json"
          cat "${PKG_DIR}/package.json"
          ls -la "${PKG_DIR}/bin"
          echo "::endgroup::"

      - name: Bundle better-sqlite3 prebuild (Node ${{ env.NODE_VERSION }} ABI)
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}-${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.os_filter }}
          TARGET_ARCH: ${{ matrix.cpu_filter }}
          BSQLITE3_VERSION: ${{ needs.prepare.outputs.bsqlite3_version }}
        run: |
          PKG_DIR="${GITHUB_WORKSPACE}/staging/@hivemine/hivectl-${PLATFORM_NAME}"
          # Install in a constraint-free temp workdir, NOT inside the staging
          # dir itself. The staging package declares os/cpu (e.g. darwin/arm64)
          # which npm enforces against the runner (linux/x64) with EBADPLATFORM
          # before even consulting the dependency.
          #
          # Use --ignore-scripts on the npm install (skip postinstall =
          # prebuild-install with implicit env), then invoke prebuild-install
          # explicitly with --platform/--arch/--target flags. This is the
          # only reliable way to fetch a prebuild for a target distinct from
          # the runner: the npm_config_target_* env vars are not consistently
          # respected by prebuild-install when invoked via npm postinstall
          # (silent fallback to building from source for the runner ABI).
          WORKDIR="$(mktemp -d)"
          cd "${WORKDIR}"
          npm init -y > /dev/null
          echo "::group::Pre-install env"
          echo "Runner platform:      $(uname -s) $(uname -m)"
          echo "Runner Node:          $(node --version)"
          echo "Runner npm:           $(npm --version)"
          echo "npm registry:         $(npm config get registry)"
          echo "Workdir:              ${WORKDIR}"
          echo "Staging dir:          ${PKG_DIR}"
          echo "Target platform:      ${TARGET_PLATFORM}"
          echo "Target arch:          ${TARGET_ARCH}"
          echo "Target Node:          ${NODE_VERSION}"
          echo "better-sqlite3 ver.:  ${BSQLITE3_VERSION} (from pnpm-lock.yaml)"
          echo "::endgroup::"
          echo "::group::npm install (no scripts, gets package + tooling without binding)"
          npm install "better-sqlite3@${BSQLITE3_VERSION}" --no-save --no-package-lock --ignore-scripts 2>&1 | tee install.log
          echo "::endgroup::"
          echo "::group::prebuild-install (explicit cross-platform fetch)"
          cd node_modules/better-sqlite3
          npx --no-install prebuild-install \
            --runtime=node \
            --target="${NODE_VERSION}.0.0" \
            --platform="${TARGET_PLATFORM}" \
            --arch="${TARGET_ARCH}" \
            --verbose 2>&1 | tee prebuild.log
          cd "${WORKDIR}"
          echo "::endgroup::"
          echo "::group::Post-install inspection — binding location discovery"
          ls -la node_modules/better-sqlite3/ 2>/dev/null || echo "(no better-sqlite3 dir)"
          ls -la node_modules/better-sqlite3/build/ 2>/dev/null || echo "(no build dir)"
          ls -la node_modules/better-sqlite3/build/Release/ 2>/dev/null || echo "(no Release dir)"
          ls -la node_modules/better-sqlite3/prebuilds/ 2>/dev/null || echo "(no prebuilds dir)"
          echo "All .node files under better-sqlite3/:"
          find node_modules/better-sqlite3/ -name "*.node" 2>/dev/null || echo "(no .node files anywhere)"
          echo "::endgroup::"
          # Move the resolved better-sqlite3 (with its fetched prebuild) into
          # the staging package's node_modules. This is what gets bundled into
          # the published tarball via `bundleDependencies`.
          mkdir -p "${PKG_DIR}/node_modules"
          cp -r "${WORKDIR}/node_modules/better-sqlite3" "${PKG_DIR}/node_modules/"
          # Bundle better-sqlite3's runtime transitive deps. better-sqlite3's
          # `lib/database.js` does `require('bindings')` lazy on
          # `new Database(...)`, and `bindings/bindings.js` does
          # `require('file-uri-to-path')` at module load time. npm does NOT
          # re-resolve transitive deps of bundleDependencies from the
          # registry on user install (treats the bundle as self-contained),
          # so without these we ship a tarball that imports a missing module
          # at runtime — `hivectl --version` works (no DB) but `hivectl init`
          # fails with "Cannot find module 'bindings'". `prebuild-install`
          # and its tree are install-time only (postinstall hook, we
          # `--ignore-scripts`) so they are NOT needed at runtime.
          RUNTIME_TRANSITIVE_DEPS=("bindings" "file-uri-to-path")
          for dep in "${RUNTIME_TRANSITIVE_DEPS[@]}"; do
            if [ ! -d "${WORKDIR}/node_modules/${dep}" ]; then
              echo "FAIL: expected runtime transitive dep ${dep} not present in WORKDIR install"
              exit 1
            fi
            cp -r "${WORKDIR}/node_modules/${dep}" "${PKG_DIR}/node_modules/"
          done
          # Extend the staging package.json's `dependencies` and
          # `bundleDependencies` with the actual installed versions of the
          # transitive deps. npm requires bundleDependencies entries to ALSO
          # be in `dependencies` for bundling to take effect (PRY-065
          # lesson). Versions read dynamically from the WORKDIR install so a
          # future better-sqlite3 bump propagates without hardcoded edits.
          node -e "
            const fs = require('fs');
            const stagingPkgPath = '${PKG_DIR}/package.json';
            const stagingPkg = JSON.parse(fs.readFileSync(stagingPkgPath, 'utf8'));
            const deps = ['bindings', 'file-uri-to-path'];
            stagingPkg.dependencies = stagingPkg.dependencies || {};
            stagingPkg.bundleDependencies = stagingPkg.bundleDependencies || [];
            for (const dep of deps) {
              const depPkg = JSON.parse(fs.readFileSync('${PKG_DIR}/node_modules/' + dep + '/package.json', 'utf8'));
              stagingPkg.dependencies[dep] = depPkg.version;
              if (!stagingPkg.bundleDependencies.includes(dep)) {
                stagingPkg.bundleDependencies.push(dep);
              }
            }
            fs.writeFileSync(stagingPkgPath, JSON.stringify(stagingPkg, null, 2) + '\n');
            console.log('Extended dependencies + bundleDependencies for transitive runtime deps:');
            console.log('  dependencies:', JSON.stringify(stagingPkg.dependencies));
            console.log('  bundleDependencies:', JSON.stringify(stagingPkg.bundleDependencies));
          "
          # Extend the bundled better-sqlite3's `files` field to include the
          # prebuilt native binding. better-sqlite3@11.x publishes with `files:
          # ["binding.gyp", "src/*.[ch]pp", "lib/**", "deps/**"]` — it does NOT
          # ship the `build/` or `prebuilds/` directories, because in normal
          # use the binding is fetched at install time via prebuild-install's
          # postinstall hook. Our shipping model bundles the binding at publish
          # time instead (so user installs do NOT run prebuild-install), so we
          # must explicitly tell npm pack to keep `build/Release/*.node` and
          # `prebuilds/**` when it bundles this dep into our platform tarball.
          # Without this, the tarball contains the source tree but not the
          # binding, and `require('better-sqlite3')` fails at runtime with
          # `Cannot find module` after dlopen tries to load the missing .node.
          node -e "
            const fs = require('fs');
            const p = '${PKG_DIR}/node_modules/better-sqlite3/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            const extra = ['build/Release/*.node', 'prebuilds/**'];
            pkg.files = Array.from(new Set([...(pkg.files || []), ...extra]));
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Extended better-sqlite3 files field:', pkg.files);
          "
          BINDING="${PKG_DIR}/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if [ ! -f "$BINDING" ]; then
            echo "FAIL: better-sqlite3 binding not present at expected path: $BINDING"
            echo "See 'Post-install inspection' group above for actual layout."
            exit 1
          fi
          echo "::group::Bundled binding (in staging dir)"
          ls -la "$BINDING"
          file "$BINDING" || true
          # Validate the binding architecture matches the target. Defensive:
          # without this assertion, a wrong-platform binding silently ships
          # to npm and breaks at install/runtime on the user's machine.
          BINDING_INFO=$(file "$BINDING")
          case "${TARGET_PLATFORM}-${TARGET_ARCH}" in
            darwin-arm64)
              echo "$BINDING_INFO" | grep -E "Mach-O.*arm64|Mach-O.*64-bit.*ARM64" > /dev/null \
                || { echo "FAIL: binding is not Mach-O arm64. Got: $BINDING_INFO"; exit 1; }
              echo "OK: binding architecture matches target ${TARGET_PLATFORM}-${TARGET_ARCH}"
              ;;
            linux-x64)
              echo "$BINDING_INFO" | grep -E "ELF.*x86-64" > /dev/null \
                || { echo "FAIL: binding is not ELF x86-64. Got: $BINDING_INFO"; exit 1; }
              echo "OK: binding architecture matches target ${TARGET_PLATFORM}-${TARGET_ARCH}"
              ;;
            linux-arm64)
              echo "$BINDING_INFO" | grep -E "ELF.*aarch64|ELF.*ARM aarch64" > /dev/null \
                || { echo "FAIL: binding is not ELF aarch64. Got: $BINDING_INFO"; exit 1; }
              echo "OK: binding architecture matches target ${TARGET_PLATFORM}-${TARGET_ARCH}"
              ;;
            *)
              echo "WARN: no architecture assertion configured for ${TARGET_PLATFORM}-${TARGET_ARCH} — binding shipped unverified"
              ;;
          esac
          echo "::endgroup::"

      - name: Validate published tarball contains bundled binding (Test layer 1)
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          # Run `npm pack` against the staging dir and assert the resulting
          # tarball includes the bundled better_sqlite3 binding. This catches
          # the silent no-op of `bundleDependencies` when the corresponding
          # `dependencies` field is missing from package.json — the tarball
          # would otherwise contain only `bin/hivectl` + `package.json` (2
          # files) and the binary would fail at runtime with `Cannot find
          # module 'better-sqlite3'`. Runs in both real and dry-run mode
          # since pack output is a pure function of the staging dir.
          PKG_DIR="${GITHUB_WORKSPACE}/staging/@hivemine/hivectl-${PLATFORM_NAME}"
          cd "${PKG_DIR}"
          TARBALL=$(npm pack --silent)
          # Capture the tarball listing once into a variable. tar -tzf piped
          # into grep -q causes SIGPIPE when grep exits early on a match;
          # under bash `set -o pipefail` (the GHA default for `run:` blocks)
          # the SIGPIPE makes the whole pipeline exit non-zero and the
          # surrounding `if !` then sees a "miss" even though grep matched.
          # Capturing once + grepping against the variable avoids the pipe
          # entirely and also makes the assertions cheaper on a large tarball.
          LISTING=$(tar -tzf "${TARBALL}")
          echo "::group::Tarball contents"
          printf '%s\n' "${LISTING}"
          echo "::endgroup::"
          FILE_COUNT=$(printf '%s\n' "${LISTING}" | wc -l | tr -d ' ')
          if [ "${FILE_COUNT}" -le 2 ]; then
            echo "FAIL: tarball has only ${FILE_COUNT} files — bundleDependencies likely silent no-op"
            echo "Expected: bin/hivectl + package.json + node_modules/better-sqlite3/** (>50 files)"
            echo "Hint: package.json must declare BOTH 'dependencies' and 'bundleDependencies' for bundling to work."
            exit 1
          fi
          if ! printf '%s\n' "${LISTING}" | grep -q "node_modules/better-sqlite3/build/Release/better_sqlite3.node"; then
            echo "FAIL: tarball missing better_sqlite3.node — bundleDependencies not effective"
            echo "Hint: package.json must declare BOTH 'dependencies' and 'bundleDependencies' for bundling to work."
            exit 1
          fi
          if ! printf '%s\n' "${LISTING}" | grep -q "^package/package.json$"; then
            echo "FAIL: tarball missing package.json"
            exit 1
          fi
          echo "OK: tarball contains ${FILE_COUNT} files including better_sqlite3.node binding"
          # Cleanup local tarball; the actual `Publish to npm` step regenerates fresh.
          rm -f "${TARBALL}"

      - name: Smoke-test bundled tarball with require + new Database (Test layer 4)
        if: ${{ matrix.os_filter == 'linux' && matrix.cpu_filter == 'x64' }}
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          # Install the staged tarball into a fresh tmp dir and actually
          # exercise better-sqlite3's runtime path: load module, create
          # in-memory DB, exec a statement, close. This catches missing
          # transitive runtime deps at publish time — which Test layers
          # 1-3 do NOT (Test layer 1 only greps for the binding file,
          # Test layer 2 is registry-only, Test layer 3 only validates
          # pack-time + auth without running the resulting bundle).
          # Runs in BOTH dry-run and real mode.
          #
          # Conditional on linux-x64 matrix entry: the publish-binaries
          # job runs on ubuntu-latest for every matrix entry, so npm
          # install of a tarball declaring os:["darwin"] or cpu:["arm64"]
          # is rejected with EBADPLATFORM on the runner. For darwin-arm64
          # and linux-arm64 this step is skipped — the runtime JS dep
          # tree (better-sqlite3 + bindings + file-uri-to-path) is
          # platform-independent, so a successful smoke on linux-x64
          # implies the same JS resolution would succeed on the other
          # platforms. The binding architecture itself is verified by
          # Test layer 1 (file present in tarball with the correct
          # arch per per-platform `file` arch assertion in the bundle
          # step).
          PKG_DIR="${GITHUB_WORKSPACE}/staging/@hivemine/hivectl-${PLATFORM_NAME}"
          cd "${PKG_DIR}"
          TARBALL=$(npm pack --silent)
          TEST_DIR=$(mktemp -d)
          pushd "${TEST_DIR}" > /dev/null
          npm init -y > /dev/null
          echo "::group::npm install <staged-tarball>"
          npm install "${PKG_DIR}/${TARBALL}" --no-save --ignore-scripts 2>&1 | tail -5
          echo "::endgroup::"
          BSQ_PATH="${TEST_DIR}/node_modules/@hivemine/hivectl-${PLATFORM_NAME}/node_modules/better-sqlite3"
          if [ ! -d "${BSQ_PATH}" ]; then
            echo "FAIL: better-sqlite3 not present in installed tarball at ${BSQ_PATH}"
            ls -la "${TEST_DIR}/node_modules/" 2>/dev/null || true
            exit 1
          fi
          echo "::group::Smoke — require + new Database + exec + close"
          node -e "
            const Db = require('${BSQ_PATH}');
            const db = new Db(':memory:');
            db.exec('CREATE TABLE t (x INTEGER); INSERT INTO t VALUES (1);');
            const row = db.prepare('SELECT x FROM t').get();
            if (row.x !== 1) {
              console.error('FAIL: expected row.x=1, got', row);
              process.exit(1);
            }
            db.close();
            console.log('OK: better-sqlite3 loads, opens DB, exec, query, close — all runtime deps resolve');
          "
          echo "::endgroup::"
          popd > /dev/null
          rm -rf "${TEST_DIR}"
          rm -f "${PKG_DIR}/${TARBALL}"

      - name: Verify version is publishable (Test layer 2 — burn check)
        if: ${{ needs.prepare.outputs.dry_run == 'false' }}
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}-${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Distinguish three states of the target version on the registry:
          #   (a) currently published       → `npm view <pkg>@<v> version`
          #                                   exits 0 with the version string.
          #                                   Republishing would conflict; FAIL.
          #   (b) version-specific burn     → `npm view <pkg>@<v>` returns
          #                                   "Unpublished on <ts>" with a
          #                                   timestamp from when THIS version
          #                                   was unpublished, AND the package
          #                                   itself still has other versions
          #                                   published. The version-string is
          #                                   permanently reserved by npm
          #                                   policy; FAIL.
          #   (c) package fully unpublished → `npm view <pkg>@<v>` returns
          #                                   "Unpublished on <ts>" but it is
          #                                   the package-level state; npm
          #                                   returns the same message for any
          #                                   version of a fully-unpublished
          #                                   package, including versions that
          #                                   were never published. WARN and
          #                                   defer to the real `npm publish`
          #                                   step, which fails loudly with
          #                                   E403/E400 if the version is
          #                                   actually burned.
          PKG_NAME="@hivemine/hivectl-${PLATFORM_NAME}"
          set +e
          VIEW_VER_OUTPUT=$(npm view "${PKG_NAME}@${VERSION}" version 2>&1)
          VIEW_VER_EXIT=$?
          set -e
          if [ "${VIEW_VER_EXIT}" -eq 0 ] && [ -n "${VIEW_VER_OUTPUT}" ]; then
            echo "FAIL: ${PKG_NAME}@${VERSION} already published; cannot republish same version-string."
            echo "Bump version in CHANGELOG.md and retag."
            exit 1
          fi
          if printf '%s\n' "${VIEW_VER_OUTPUT}" | grep -q "Unpublished on"; then
            # Disambiguate (b) vs (c): query the package without the version
            # specifier and compare timestamps.
            set +e
            VIEW_PKG_OUTPUT=$(npm view "${PKG_NAME}" 2>&1)
            set -e
            VER_UNPUB_TS=$(printf '%s\n' "${VIEW_VER_OUTPUT}" | grep -oE "Unpublished on [0-9TZ:.-]+" | head -1)
            PKG_UNPUB_TS=$(printf '%s\n' "${VIEW_PKG_OUTPUT}" | grep -oE "Unpublished on [0-9TZ:.-]+" | head -1)
            if [ -n "${PKG_UNPUB_TS}" ] && [ "${PKG_UNPUB_TS}" = "${VER_UNPUB_TS}" ]; then
              echo "WARN: ${PKG_NAME} is fully unpublished (${PKG_UNPUB_TS});"
              echo "      cannot determine version-string burn state from npm view alone in this state"
              echo "      (npm returns the package-level message for any version queried)."
              echo "      Proceeding to real publish — npm will reject with E403/E400"
              echo "      if ${VERSION} was previously published-and-unpublished."
              exit 0
            fi
            echo "FAIL: ${PKG_NAME}@${VERSION} was unpublished (version-string permanently burned by npm policy)."
            echo "${VIEW_VER_OUTPUT}"
            echo "Bump version in CHANGELOG.md and retag."
            exit 1
          fi
          echo "OK: ${PKG_NAME}@${VERSION} is free to publish"

      - name: Publish to npm
        if: ${{ needs.prepare.outputs.dry_run == 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PLATFORM_NAME="${{ matrix.platform }}-${{ matrix.arch }}"
          cd "staging/@hivemine/hivectl-${PLATFORM_NAME}"
          npm publish --access public

      - name: Validate publish in dry-run mode (Test layer 3)
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # `npm publish --dry-run` validates auth + tarball + local hooks
          # WITHOUT uploading to the registry. Replaces the previous echo-only
          # summary step that left the entire publish path untested in
          # dry-run mode (the blind spot that allowed the bundleDependencies
          # bug to ship undetected across PRY-060 → PRY-064).
          PLATFORM_NAME="${{ matrix.platform }}-${{ matrix.arch }}"
          cd "staging/@hivemine/hivectl-${PLATFORM_NAME}"
          npm publish --dry-run --access public
          echo "[dry-run] validated @hivemine/hivectl-${PLATFORM_NAME}@${{ needs.prepare.outputs.version }} would publish successfully"

  publish-wrapper:
    name: Publish wrapper package
    needs: [prepare, publish-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Pin wrapper version + optionalDependencies
        run: |
          cd npm/hivectl
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.prepare.outputs.version }}';
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '${{ needs.prepare.outputs.version }}';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          cat package.json

      - name: Verify wrapper version is publishable (Test layer 2 — burn check)
        if: ${{ needs.prepare.outputs.dry_run == 'false' }}
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Same disambiguation logic as publish-binaries Test layer 2: separate
          # currently-published, version-specific burn, and package-level
          # fully-unpublished states (npm returns the package-level
          # "Unpublished on" message for any version queried when the package
          # has no remaining versions). See the publish-binaries equivalent
          # step for the full case-by-case rationale.
          PKG_NAME="@hivemine/hivectl"
          set +e
          VIEW_VER_OUTPUT=$(npm view "${PKG_NAME}@${VERSION}" version 2>&1)
          VIEW_VER_EXIT=$?
          set -e
          if [ "${VIEW_VER_EXIT}" -eq 0 ] && [ -n "${VIEW_VER_OUTPUT}" ]; then
            echo "FAIL: ${PKG_NAME}@${VERSION} already published; cannot republish same version-string."
            echo "Bump version in CHANGELOG.md and retag."
            exit 1
          fi
          if printf '%s\n' "${VIEW_VER_OUTPUT}" | grep -q "Unpublished on"; then
            set +e
            VIEW_PKG_OUTPUT=$(npm view "${PKG_NAME}" 2>&1)
            set -e
            VER_UNPUB_TS=$(printf '%s\n' "${VIEW_VER_OUTPUT}" | grep -oE "Unpublished on [0-9TZ:.-]+" | head -1)
            PKG_UNPUB_TS=$(printf '%s\n' "${VIEW_PKG_OUTPUT}" | grep -oE "Unpublished on [0-9TZ:.-]+" | head -1)
            if [ -n "${PKG_UNPUB_TS}" ] && [ "${PKG_UNPUB_TS}" = "${VER_UNPUB_TS}" ]; then
              echo "WARN: ${PKG_NAME} is fully unpublished (${PKG_UNPUB_TS});"
              echo "      cannot determine version-string burn state from npm view alone in this state"
              echo "      (npm returns the package-level message for any version queried)."
              echo "      Proceeding to real publish — npm will reject with E403/E400"
              echo "      if ${VERSION} was previously published-and-unpublished."
              exit 0
            fi
            echo "FAIL: ${PKG_NAME}@${VERSION} was unpublished (version-string permanently burned by npm policy)."
            echo "${VIEW_VER_OUTPUT}"
            echo "Bump version in CHANGELOG.md and retag."
            exit 1
          fi
          echo "OK: ${PKG_NAME}@${VERSION} is free to publish"

      - name: Publish to npm
        if: ${{ needs.prepare.outputs.dry_run == 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm/hivectl
          npm publish --access public

      - name: Validate publish in dry-run mode (Test layer 3)
        if: ${{ needs.prepare.outputs.dry_run == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Same dry-run real-publish-path validation as publish-binaries
          # Test layer 3; applied to the wrapper package. Replaces the
          # previous echo-only summary so dry-run mode actually exercises
          # the publish code path.
          cd npm/hivectl
          npm publish --dry-run --access public
          echo "[dry-run] validated @hivemine/hivectl@${{ needs.prepare.outputs.version }} would publish successfully"

  github-release:
    name: GitHub release
    needs: [prepare, publish-wrapper]
    if: ${{ needs.prepare.outputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Rename binaries for release assets
        shell: bash
        run: |
          mkdir -p release-assets
          for dir in artifacts/hivectl-*; do
            platform_arch="${dir#artifacts/hivectl-}"
            cp "${dir}/hivectl" "release-assets/hivectl-${platform_arch}"
            chmod +x "release-assets/hivectl-${platform_arch}"
          done
          ls -la release-assets

      # workflow_dispatch path: no GitHub release exists yet — create it with
      # an auto-generated body and attach the binaries.
      - name: Create GitHub release (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # Pinned to commit SHA (release 2.6.2) per security review; mutable v2
        # tag would let a compromised action exfiltrate the workflow's
        # GITHUB_TOKEN (contents: write).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release event path: the release was already created by the operator
      # via the GitHub Releases UI. Attach the binaries to the existing release
      # without overwriting the UI-set name or body. softprops/action-gh-release
      # treats an existing tag as an update operation; omitting `name` and
      # `body` preserves whatever was set in the UI.
      - name: Attach binaries to GitHub release (release event)
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
