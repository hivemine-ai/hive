name: Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli-sqlite-e2e:
    name: cli + sqlite e2e (Topology 1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Bootstrap a Hive (hivectl init → SQLite + first credential)
        id: init
        env:
          # `hive list-keepers` (used after init) consumes these via wire.startCli().
          # `init` itself takes the same paths as CLI flags below.
          HIVE_DB_URL: sqlite:${{ runner.temp }}/hive.sqlite
          HIVE_AUTH_KEYS_DIR: ${{ runner.temp }}/keys
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/keys"
          # `init` reads --db and --keys-dir as flags (NOT env). Pass them
          # explicitly so the server (which DOES read env) finds the same
          # state in subsequent steps.
          node packages/cli/dist/main.js init \
            --admin-email ci@hive.test \
            --admin-display-name 'CI Smoke Admin' \
            --db "sqlite:${{ runner.temp }}/hive.sqlite" \
            --keys-dir "${{ runner.temp }}/keys" \
            --output-credential "${{ runner.temp }}/admin.jwt"
          # Look up the admin's participantId via hivectl. `list-keepers --output json`
          # emits the keeper array directly (no `items` wrapper).
          ADMIN_PARTICIPANT_ID=$(node packages/cli/dist/main.js hive list-keepers --output json \
            | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")); const k=Array.isArray(a)?a.find(k=>k.email==="ci@hive.test"):null; if(!k){console.error("ci@hive.test keeper not found",JSON.stringify(a)); process.exit(1)} console.log(k.id)')
          echo "admin_participant_id=$ADMIN_PARTICIPANT_ID" >> "$GITHUB_OUTPUT"
          echo "Bootstrapped Hive — admin participantId=$ADMIN_PARTICIPANT_ID"

      - name: Start hive-server in the background
        env:
          HIVE_DB_URL: sqlite:${{ runner.temp }}/hive.sqlite
          HIVE_AUTH_KEYS_DIR: ${{ runner.temp }}/keys
          HIVE_MCP_HTTP_HOST: 127.0.0.1
          HIVE_MCP_HTTP_PORT: '8443'
          HIVE_MCP_LOG_LEVEL: info
          # PRY-051 changed the default `serve` output to a 3-phase formatted
          # shape (banner → live formatted log lines → readiness). The PRY-018
          # observability ACs (verified later in this job) parse `server.log`
          # as JSON-per-line, so the smoke must opt back into JSON mode.
          # `HIVE_MCP_LOG_PRETTY=false` is the canonical log-shipper opt-out
          # (equivalent to `--output=json` — see docs/hivectl.md § serve).
          HIVE_MCP_LOG_PRETTY: 'false'
        run: |
          set -euo pipefail
          # nohup + disown keeps the process alive after this step ends. PID
          # is written to a file so the cleanup step can SIGTERM it.
          # `hivectl serve` (PRY-031) is the canonical foreground entry point —
          # the legacy `packages/server/dist/main.js` still works but emits a
          # deprecation warning.
          nohup node packages/cli/dist/main.js serve > "${{ runner.temp }}/server.log" 2>&1 &
          echo $! > "${{ runner.temp }}/server.pid"
          echo "Server started — pid=$(cat "${{ runner.temp }}/server.pid")"

      - name: Wait for /readyz to return 200
        run: |
          set -uo pipefail
          # NOTE: -e omitted intentionally — the polling loop relies on `curl`
          # failing while the server starts. Each curl is checked via `if`,
          # so an early failure is not an error condition.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8443/readyz > /dev/null; then
              echo "/readyz is 200 (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become ready within 30s"
          echo '--- server.log ---'
          cat "${{ runner.temp }}/server.log" || true
          exit 1

      - name: Verify /healthz, /readyz, /.well-known/jwks.json
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8443/healthz > /dev/null
          curl -fsS http://127.0.0.1:8443/readyz > /dev/null
          KEYS=$(curl -fsS http://127.0.0.1:8443/.well-known/jwks.json | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log((j.keys||[]).length)')
          if [ "$KEYS" -lt 1 ]; then echo "::error::JWKS has 0 keys"; exit 1; fi
          echo "Endpoints ok (jwks has $KEYS key(s))"

      - name: MCP roundtrip — initialize + tools/call get_agent_config
        run: |
          set -euo pipefail
          JWT=$(cat "${{ runner.temp }}/admin.jwt")
          node deployment/smoke-mcp-client.mjs \
            http://127.0.0.1:8443 \
            "$JWT" \
            "${{ steps.init.outputs.admin_participant_id }}"

      - name: Verify observability ACs against server.log (PRY-018)
        run: |
          set -euo pipefail
          LOG="${{ runner.temp }}/server.log"

          # AC1: each HTTP request emits http_request_completed with a unique UUIDv7 requestId.
          COMPLETED_COUNT=$(grep -c '"event":"http_request_completed"' "$LOG" || true)
          if [ "$COMPLETED_COUNT" -lt 3 ]; then
            echo "::error::AC1 — expected ≥ 3 http_request_completed events, got $COMPLETED_COUNT"
            grep '"event":"http_request_completed"' "$LOG" || true
            exit 1
          fi
          UNIQUE_IDS=$(grep '"event":"http_request_completed"' "$LOG" \
            | node -e 'const ls=require("fs").readFileSync(0,"utf8").trim().split("\n"); const ids=ls.map(l=>JSON.parse(l).requestId); console.log([...new Set(ids)].length, ids.length)')
          UNIQUE=$(echo "$UNIQUE_IDS" | awk '{print $1}')
          TOTAL=$(echo "$UNIQUE_IDS" | awk '{print $2}')
          if [ "$UNIQUE" != "$TOTAL" ]; then
            echo "::error::AC1 — requestIds are not unique ($UNIQUE unique / $TOTAL total)"
            exit 1
          fi
          echo "AC1 ✓ — $COMPLETED_COUNT http_request_completed events, all requestIds unique"

          # AC2: required fields present.
          node -e '
            const ls=require("fs").readFileSync(process.argv[1],"utf8").split("\n").filter(Boolean);
            const completed=ls.map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(o=>o&&o.event==="http_request_completed");
            for (const e of completed) {
              for (const f of ["requestId","method","path","statusCode","durationMs","level"]) {
                if (e[f]===undefined) { console.error("AC2 missing field",f,JSON.stringify(e)); process.exit(1); }
              }
              if (e.level !== 30) { console.error("AC2 level not 30",JSON.stringify(e)); process.exit(1); }
            }
          ' "$LOG"
          echo "AC2 ✓ — required fields present + level=30"

          # AC3: audit_log row request_id matches the audit_recorded log line requestId.
          AUDIT_RECORDED_COUNT=$(grep -c '"event":"audit_recorded"' "$LOG" || true)
          if [ "$AUDIT_RECORDED_COUNT" -ge 1 ]; then
            LOG_ID=$(grep '"event":"audit_recorded"' "$LOG" | head -1 \
              | node -e 'const o=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log(o.requestId ?? "")')
            if [ -z "$LOG_ID" ] || [ "$LOG_ID" = "null" ]; then
              echo "AC3 ✓ — audit_recorded carries a requestId field (null is valid for CLI-driven events)"
            else
              DB_ID=$(sqlite3 "${{ runner.temp }}/hive.sqlite" "SELECT request_id FROM audit_log WHERE request_id IS NOT NULL LIMIT 1;" || true)
              if [ "$LOG_ID" != "$DB_ID" ]; then
                echo "::error::AC3 — log requestId ($LOG_ID) ≠ audit_log.request_id ($DB_ID)"
                exit 1
              fi
              echo "AC3 ✓ — audit_log.request_id matches log stream ($LOG_ID)"
            fi
          else
            echo "AC3 ⚠️ — no audit_recorded events in this run (admin operations are CLI-only and the log started fresh after init)"
          fi

          # AC5: Authorization is masked — JWT prefix `eyJ` MUST NOT appear.
          if grep -E '"authorization":"Bearer eyJ' "$LOG" > /dev/null 2>&1; then
            echo "::error::AC5 — bearer token leaked in log"
            grep -E '"authorization":"Bearer eyJ' "$LOG" | head -3
            exit 1
          fi
          echo "AC5 ✓ — no bearer token leaked"

          # AC6: happy-path info events emitted.
          for EV in mcp_session_opened auth_credential_verified mcp_tool_dispatch_success wire_started; do
            COUNT=$(grep -c "\"event\":\"$EV\"" "$LOG" || true)
            if [ "$COUNT" -lt 1 ]; then
              echo "::error::AC6 — expected ≥ 1 '$EV' event, got $COUNT"
              exit 1
            fi
          done
          echo "AC6 ✓ — happy-path info events present"

          # AC8: stdout consumer warn does NOT fire on this healthy run (CI captures stdout).
          if grep -q '"event":"stdout_consumer_missing"' "$LOG"; then
            echo "::error::AC8 — stdout_consumer_missing fired on a healthy CI run (false positive)"
            grep '"event":"stdout_consumer_missing"' "$LOG"
            exit 1
          fi
          echo "AC8 ✓ — stdout consumer healthy"

          echo "All observability ACs satisfied."

      - name: Cleanup — stop server + verify shutdown ACs
        if: always()
        run: |
          set -uo pipefail
          # NOTE: -e omitted intentionally — `kill -TERM/KILL` against a
          # dead PID returns non-zero and we use `|| true` to mask that.
          # `set -e` would exit before reaching `tail` of server.log.
          if [ -f "${{ runner.temp }}/server.pid" ]; then
            PID=$(cat "${{ runner.temp }}/server.pid")
            kill -TERM "$PID" 2>/dev/null || true
            # Give the drain a moment, then SIGKILL if still alive.
            for i in 1 2 3 4 5; do
              if ! kill -0 "$PID" 2>/dev/null; then break; fi
              sleep 1
            done
            kill -KILL "$PID" 2>/dev/null || true
          fi
          echo '--- server.log tail ---'
          tail -100 "${{ runner.temp }}/server.log" 2>/dev/null || true

          # AC7 cousin — wire_stopping + wire_stopped emitted on graceful shutdown.
          # `flushLogger` itself is exercised by unit tests (mock pino flush);
          # here we verify the surrounding shutdown lifecycle events made it.
          LOG="${{ runner.temp }}/server.log"
          if [ -f "$LOG" ]; then
            if ! grep -q '"event":"wire_stopping"' "$LOG"; then
              echo "::warning::wire_stopping not found in server.log (server may have crashed)"
            fi
            if ! grep -q '"event":"wire_stopped"' "$LOG"; then
              echo "::warning::wire_stopped not found in server.log (graceful drain may have failed)"
            fi
          fi

  docker-build:
    name: docker image build (Topology 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose syntax (default — no profile)
        run: docker compose -f deployment/docker-compose.yml config > /dev/null

      - name: Validate compose syntax (--profile postgres)
        env:
          POSTGRES_PASSWORD: smoke-only-not-a-real-password
        run: docker compose -f deployment/docker-compose.yml --profile postgres config > /dev/null

      - name: Build image (direct docker build for deterministic tagging)
        run: docker build -f deployment/Dockerfile -t hive:smoke .

      - name: Verify image size < 300 MB compressed
        run: |
          set -euo pipefail
          # `docker image inspect` returns the uncompressed virtual size; the
          # compressed size (registry pull size) is best estimated by saving
          # the image to a tar and gzipping it.
          docker image inspect hive:smoke --format '{{.Size}} bytes uncompressed'
          docker image save hive:smoke | gzip --best > /tmp/hive-image.tgz
          SIZE=$(stat -c '%s' /tmp/hive-image.tgz)
          MAX=$((300 * 1024 * 1024))
          echo "Compressed image size: $SIZE bytes (limit $MAX)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::image exceeds 300 MB compressed limit"
            exit 1
          fi
